<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>🎯 Gomoku Amőba Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎯 Gomoku Amőba — Online</h1>

    <!-- Szoba választó képernyő -->
    <div id="lobby">
        <button id="createRoomBtn">➕ Új szoba létrehozása</button>
        <div class="divider">vagy</div>
        <input id="roomCodeInput" placeholder="Szoba kód (pl. ABCDE)" maxlength="5">
        <button id="joinRoomBtn">🔑 Csatlakozás</button>
        <p id="lobbyMessage"></p>
    </div>

    <!-- Játék képernyő (kezdetben rejtve) -->
    <div id="gameScreen" style="display:none;">
        <div id="roomInfo">Szoba kód: <strong id="roomCodeDisplay"></strong> (küldd el a haverodnak!)</div>
        <div id="status">Várakozás a másik játékosra...</div>
        <div id="board-wrapper">
            <div id="board"></div>
        </div>
        <button id="restartBtn">🔄 Új játék (ugyanebben a szobában)</button>
    </div>

    <!-- Firebase SDK betöltése -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
